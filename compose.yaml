# Local development dependencies. Never used in production.
# Start with: pnpm db:up
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opsbook
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: opsbook_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage so the media pipeline is exercised locally
  # exactly as it will be in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opsbook
      MINIO_ROOT_PASSWORD: local_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
