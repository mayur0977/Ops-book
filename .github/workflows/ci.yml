name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  PNPM_VERSION: "11.24.0"

jobs:
  # Cheap, whole-workspace checks. These catch cross-package breakage that
  # filtered jobs would miss.
  check:
    name: Typecheck, lint, invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # turbo --filter needs history
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: No vertical vocabulary in core code
        run: pnpm check:vertical-leak
      - name: Shared packages stay client-safe
        run: pnpm check:client-safe

  # Only the packages affected by this change.
  test:
    name: Affected tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: daybook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://daybook:ci@localhost:5432/daybook_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
      SMS_PROVIDER: console
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test affected packages
        run: pnpm turbo run test --filter=...[origin/main]

  # Tenant isolation is a Critical requirement (BR-001). It gets its own job so
  # a failure is unmissable in the checks list.
  tenant-isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/api/package.json') != '' }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: daybook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://daybook:ci@localhost:5432/daybook_test
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
      SMS_PROVIDER: console
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daybook/api test:tenant

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
