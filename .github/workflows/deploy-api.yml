name: Deploy API

on:
  push:
    branches: [main]          # -> staging
    tags: ["api-v*"]          # -> production
  workflow_dispatch:

env:
  NODE_VERSION: "24.20.0"
  PNPM_VERSION: "11.24.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/api-v') && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NOTE: build context is the REPO ROOT — the image needs packages/*.
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t opsbook-api:${{ github.sha }} .

      # Migrations run as a SEPARATE, reviewable step, before the new image
      # takes traffic. Reversible, or accompanied by a written backout plan.
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @opsbook/api db:migrate

      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: echo "TODO(phase-01): platform deploy command"

      - name: Verify health
        run: echo "TODO(phase-01): curl /health and fail the job on non-200"

      - name: Publish OpenAPI (documentation only)
        run: echo "TODO(phase-01): upload generated openapi.json"

      - name: Sentry release
        if: startsWith(github.ref, 'refs/tags/api-v')
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: echo "TODO(phase-01): create Sentry release"
